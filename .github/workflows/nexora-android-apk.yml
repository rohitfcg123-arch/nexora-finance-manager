name: Build Nexora Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android_app/**'
      - '.github/workflows/nexora-android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Create Android platform files
        run: |
          flutter create . --platforms=android --org com.nexora --project-name finance_manager
          # Install the registered Android Firebase client config into the generated platform project.
          test -s google-services.json
          cp google-services.json android/app/google-services.json
          rm -f test/widget_test.dart
          # SMS access is opt-in in the app; declare permissions for Android runtime prompts.
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.READ_SMS" />\n    <uses-permission android:name="android.permission.RECEIVE_SMS" />' android/app/src/main/AndroidManifest.xml
          # Current Flutter plugins require Android compile SDK 36 or newer.
          if [ -f android/app/build.gradle.kts ]; then
            sed -i -E 's/^[[:space:]]*compileSdk[[:space:]]*=.*/    compileSdk = 36/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i -E 's/^[[:space:]]*compileSdkVersion[[:space:]].*/    compileSdkVersion 36/' android/app/build.gradle
          fi
          echo 'Effective Android compile SDK:'
          grep -nE 'compileSdk(Version)?[[:space:]]*=?' android/app/build.gradle* || true
      - run: flutter pub get
      - name: Align Android plugin compile SDKs
        run: |
          # Some plugin modules pin their own compile SDK, independent of app-level compileSdk.
          find "$HOME/.pub-cache/hosted/pub.dev" -path '*/android/build.gradle*' -type f -print0 | while IFS= read -r -d '' file; do
            sed -i -E 's/^[[:space:]]*compileSdkVersion[[:space:]]+.*/    compileSdkVersion 36/; s/^[[:space:]]*compileSdk[[:space:]]*=.*/    compileSdk = 36/' "$file"
          done
          # AGP 8+ requires a namespace; telephony 0.2.0 predates that requirement.
          telephony_gradle="$HOME/.pub-cache/hosted/pub.dev/telephony-0.2.0/android/build.gradle"
          if [ -f "$telephony_gradle" ]; then
            if ! grep -qE '^[[:space:]]*namespace[[:space:]]' "$telephony_gradle"; then
              sed -i '/^[[:space:]]*android[[:space:]]*{/a\    namespace "com.shounakmulay.telephony"' "$telephony_gradle"
            fi
            # Legacy telephony targets Kotlin 1.8 by default, while the generated
            # Android Java tasks target 11; align both compile tasks to JVM 11.
            if ! grep -q 'jvmTarget = "11"' "$telephony_gradle"; then
              cat >> "$telephony_gradle" <<'TELEPHONY_GRADLE'
          
          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions { jvmTarget = "11" }
          }
          TELEPHONY_GRADLE
            fi
          fi
          # Force compile SDK 36 for any plugin module still relying on Flutter defaults.
          cat >> android/build.gradle <<'GRADLE'

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android.compileSdkVersion = 36
                  }
              }
          }
          GRADLE
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build APK and normalize output path
        shell: bash
        run: |
          set +e
          flutter build apk --debug --verbose 2>&1 | tee /tmp/nexora-flutter-build.log
          flutter_exit=${PIPESTATUS[0]}
          set -e

          echo "Flutter build exit code: $flutter_exit"
          echo "APK files generated by Gradle/Flutter:"
          find android/app/build/outputs build/app/outputs -type f -name '*.apk' -print 2>/dev/null || true

          # Modern Flutter/AGP projects may leave the APK in Gradle's native output
          # directory even when Flutter's artifact-copy step cannot locate it.
          apk_path="$(find android/app/build/outputs/apk -type f -name '*.apk' 2>/dev/null | sort | head -n 1)"
          if [ -z "$apk_path" ]; then
            apk_path="$(find build/app/outputs/flutter-apk -type f -name '*.apk' 2>/dev/null | sort | head -n 1)"
          fi
          if [ -z "$apk_path" ]; then
            apk_path="$(find . -type f -name '*debug*.apk' -not -path './.dart_tool/*' 2>/dev/null | sort | head -n 1)"
          fi

          if [ -n "$apk_path" ] && [ -s "$apk_path" ]; then
            mkdir -p build/app/outputs/flutter-apk
            if [ "$apk_path" != "build/app/outputs/flutter-apk/app-debug.apk" ]; then
              cp "$apk_path" build/app/outputs/flutter-apk/app-debug.apk
            fi
            test -s build/app/outputs/flutter-apk/app-debug.apk
            echo "APK ready: build/app/outputs/flutter-apk/app-debug.apk"
          else
            echo "::error::No debug APK was generated. Relevant Gradle/Flutter log:"
            grep -E -i 'FAILURE:|BUILD FAILED|What went wrong|exception|error:|Could not|failed|timed out' /tmp/nexora-flutter-build.log | tail -n 120 || true
            echo "Generated APK paths:"
            find . -type f -name '*.apk' -print 2>/dev/null || true
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nexora-finance-manager-debug-apk
          path: android_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
