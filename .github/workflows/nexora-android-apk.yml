name: Build Nexora Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android_app/**'
      - '.github/workflows/nexora-android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Create Android platform files
        run: |
          flutter create . --platforms=android --org com.nexora --project-name finance_manager
          rm -f test/widget_test.dart
          # Current Flutter plugins require Android compile SDK 36 or newer.
          if [ -f android/app/build.gradle.kts ]; then
            sed -i -E 's/^[[:space:]]*compileSdk[[:space:]]*=.*/    compileSdk = 36/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i -E 's/^[[:space:]]*compileSdkVersion[[:space:]].*/    compileSdkVersion 36/' android/app/build.gradle
          fi
          echo 'Effective Android compile SDK:'
          grep -nE 'compileSdk(Version)?[[:space:]]*=?' android/app/build.gradle* || true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: nexora-finance-manager-debug-apk
          path: android_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
