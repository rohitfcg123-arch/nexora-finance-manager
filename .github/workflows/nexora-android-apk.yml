name: Build Nexora Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android_app/**'
      - '.github/workflows/nexora-android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Create Android platform files
        run: |
          flutter create . --platforms=android --org com.nexora --project-name finance_manager
          rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: nexora-finance-manager-debug-apk
          path: android_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
